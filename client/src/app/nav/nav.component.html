<nav class="navbar navbar-expand-lg bg-dark bg-body-tertiary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="#">Dating App</a>

    @if (accountService.currentUser()) {
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link">Matches</a>
        </li>
        <li class="nav-item">
          <a class="nav-link">Lists</a>
        </li>
        <li class="nav-item">
          <a class="nav-link">Messages</a>
        </li>
      </ul>
      <div dropdown class="dropdown">
          <a dropdownToggle class="dropdown-toggle text-light text-decoration-none">
              Welcome User
          </a>
          <div *dropdownMenu class="dropdown-menu">
              <a class="dropdown-item">Edit profile</a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" (click)="logout()">Logout</a>
          </div>
      </div>
    } @else {
      <form #loginForm="ngForm" class="d-flex" (ngSubmit)="login()" role="search">
        <input
          class="form-control me-2"
          [(ngModel)]="from.userName"
          name="userName"
          placeholder="Username"
          aria-label="UserName"
        />
        <input
          class="form-control me-2"
          [(ngModel)]="from.password"
          name="password"
          type="password"
          placeholder="Password"
          aria-label="Password"
        />
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Login</button>
      </form>
    }
  </div>
</nav>
