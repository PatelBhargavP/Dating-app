<form #registerForm="ngForm" (ngSubmit)="register()" autocomplete="off">
    <h2 class="text-center text-primary">Sign up</h2>
    <hr>
    <div class="mb-3 form-floating">
        <input type="text" class="form-control" id="username" placeholder="Username" name="username" [(ngModel)]="model.username" required>
        <label for="username">Username</label>
    </div>
    <div class="mb-3 form-floating">
        <input type="password" class="form-control" id="password" placeholder="Password" name="password" [(ngModel)]="model.password" required>
        <label for="password">Password</label>
    </div>

    <div class="form-group test-center">
        <button type="submit" class="btn btn-success me-2">Register</button>
        <button type="button" class="btn btn-default me-2" (click)="cancel()">Cancel</button>
    </div>
</form>
